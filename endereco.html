<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <title>Adicionar novo endereço | TikTok Shop</title>
  <meta name="theme-color" content="#ffffff"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"/>

  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f5f5f5; }
    .toast-msg {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(22, 24, 35, 0.95);
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      z-index: 9999;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
      opacity: 0;
      pointer-events: none;
    }
    .toast-msg.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  </style>
</head>
<body class="min-h-screen bg-[#e5e5e7]">
  <div id="toast" class="toast-msg">Mensagem</div>

  <div class="mx-auto min-h-screen w-full max-w-[440px] bg-white shadow-[0_0_40px_rgba(0,0,0,0.08)]">
    <div class="relative min-h-screen bg-[#f5f5f5] pb-[130px]">
      
      <!-- Header -->
      <div class="sticky top-0 z-30 bg-white border-b border-[#f0f0f0]">
        <div class="relative flex h-12 items-center px-2">
          <a aria-label="Voltar" href="checkout.html" class="grid h-10 w-10 place-items-center cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-6 w-6 text-[#161823]"><path d="m15 18-6-6 6-6"/></svg>
          </a>
          <div class="pointer-events-none absolute left-1/2 -translate-x-1/2 text-[17px] font-bold text-[#161823]">Adicionar o novo endereço</div>
        </div>
      </div>

      <!-- Contact Info Section -->
      <div class="px-4 pb-2 pt-4 text-[13px] font-semibold text-[#5a5b60]">Informações de contato</div>
      <div class="bg-white border-y border-[#f0f0f0]">
        <div class="px-4 border-b border-[#f0f0f0]">
          <div class="flex items-center py-3.5">
            <input id="input-nome" type="text" placeholder="Nome completo" class="w-full bg-transparent text-[15px] outline-none placeholder:text-[#8a8b91] text-[#161823]" required/>
          </div>
        </div>
        <div class="border-b border-[#f0f0f0] px-4">
          <div class="flex items-center py-3.5">
            <span class="mr-2 text-[15px] font-medium text-[#161823]">BR</span>
            <span class="mr-2 text-[15px] font-medium text-[#161823]">+55</span>
            <input id="input-telefone" type="tel" placeholder="Telefone com DDD" maxlength="15" class="w-full bg-transparent text-[15px] outline-none placeholder:text-[#8a8b91] text-[#161823]" required/>
          </div>
        </div>
        <div class="border-b border-[#f0f0f0] px-4">
          <div class="flex items-center py-3.5">
            <input id="input-cpf" type="tel" placeholder="CPF" maxlength="14" class="w-full bg-transparent text-[15px] outline-none placeholder:text-[#8a8b91] text-[#161823]" required/>
          </div>
        </div>
        <div class="px-4">
          <div class="flex items-center py-3.5">
            <input id="input-email" type="email" placeholder="E-mail" class="w-full bg-transparent text-[15px] outline-none placeholder:text-[#8a8b91] text-[#161823]" required/>
          </div>
        </div>
      </div>

      <!-- Address Info Section -->
      <div class="px-4 pb-2 pt-4 text-[13px] font-semibold text-[#5a5b60]">Informações do endereço</div>
      <div class="bg-white border-y border-[#f0f0f0]">
        <div class="border-b border-[#f0f0f0] px-4">
          <div class="flex items-center py-3.5">
            <input id="input-cep" type="tel" placeholder="CEP (ex: 01001-000)" maxlength="9" class="w-full bg-transparent text-[15px] outline-none placeholder:text-[#8a8b91] text-[#161823]" required/>
            <span id="cep-loading" class="hidden text-[12px] text-[#fe2c55] font-semibold animate-pulse shrink-0">Buscando...</span>
          </div>
        </div>
        <div class="border-b border-[#f0f0f0] px-4">
          <div class="flex items-center py-3.5">
            <input id="input-estado" type="text" placeholder="Estado (UF)" class="w-full bg-transparent text-[15px] outline-none placeholder:text-[#8a8b91] text-[#161823]" required/>
          </div>
        </div>
        <div class="border-b border-[#f0f0f0] px-4">
          <div class="flex items-center py-3.5">
            <input id="input-cidade" type="text" placeholder="Cidade" class="w-full bg-transparent text-[15px] outline-none placeholder:text-[#8a8b91] text-[#161823]" required/>
          </div>
        </div>
        <div class="border-b border-[#f0f0f0] px-4">
          <div class="flex items-center py-3.5">
            <input id="input-bairro" type="text" placeholder="Bairro" class="w-full bg-transparent text-[15px] outline-none placeholder:text-[#8a8b91] text-[#161823]" required/>
          </div>
        </div>
        <div class="border-b border-[#f0f0f0] px-4">
          <div class="flex items-center py-3.5">
            <input id="input-endereco" type="text" placeholder="Nome da rua / Avenida" class="w-full bg-transparent text-[15px] outline-none placeholder:text-[#8a8b91] text-[#161823]" required/>
          </div>
        </div>
        <div class="border-b border-[#f0f0f0] px-4">
          <div class="flex items-center py-3.5">
            <input id="input-numero" type="text" placeholder="Número" class="w-full bg-transparent text-[15px] outline-none placeholder:text-[#8a8b91] text-[#161823]" required/>
          </div>
        </div>
        <div class="px-4">
          <div class="flex items-center py-3.5">
            <input id="input-complemento" type="text" placeholder="Complemento (Apto, Bloco, etc.) (opcional)" class="w-full bg-transparent text-[15px] outline-none placeholder:text-[#8a8b91] text-[#161823]"/>
          </div>
        </div>
      </div>

      <!-- Save Button Fixed Footer -->
      <div class="fixed inset-x-0 bottom-0 z-40 mx-auto max-w-[440px] bg-white p-4 shadow-[0_-1px_0_rgba(0,0,0,0.06)] border-t border-[#f0f0f0]">
        <button onclick="salvarEndereco()" class="w-full rounded-full bg-[#fe2c55] hover:bg-[#e0264b] py-3.5 text-center text-[16px] font-bold text-white shadow-md transition active:scale-[0.98] cursor-pointer">
          Salvar endereço
        </button>
      </div>

    </div>
  </div>

  <script>
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    // Input Masks
    document.getElementById('input-telefone').addEventListener('input', function(e) {
      let v = e.target.value.replace(/\D/g, '');
      if (v.length > 11) v = v.slice(0, 11);
      if (v.length > 10) {
        v = v.replace(/^(\d{2})(\d{5})(\d{4})$/, '($1) $2-$3');
      } else if (v.length > 5) {
        v = v.replace(/^(\d{2})(\d{4})(\d{0,4})$/, '($1) $2-$3');
      } else if (v.length > 2) {
        v = v.replace(/^(\d{2})(\d{0,5})$/, '($1) $2');
      }
      e.target.value = v;
    });

    document.getElementById('input-cpf').addEventListener('input', function(e) {
      let v = e.target.value.replace(/\D/g, '');
      if (v.length > 11) v = v.slice(0, 11);
      if (v.length > 9) {
        v = v.replace(/^(\d{3})(\d{3})(\d{3})(\d{1,2})$/, '$1.$2.$3-$4');
      } else if (v.length > 6) {
        v = v.replace(/^(\d{3})(\d{3})(\d{0,3})$/, '$1.$2.$3');
      } else if (v.length > 3) {
        v = v.replace(/^(\d{3})(\d{0,3})$/, '$1.$2');
      }
      e.target.value = v;
    });

    document.getElementById('input-cep').addEventListener('input', async function(e) {
      let v = e.target.value.replace(/\D/g, '');
      if (v.length > 8) v = v.slice(0, 8);
      if (v.length === 8) {
        const loading = document.getElementById('cep-loading');
        loading.classList.remove('hidden');
        try {
          const res = await fetch('https://viacep.com.br/ws/' + v + '/json/');
          if (res.ok) {
            const data = await res.json();
            if (!data.erro) {
              document.getElementById('input-estado').value = data.uf || '';
              document.getElementById('input-cidade').value = data.localidade || '';
              document.getElementById('input-bairro').value = data.bairro || '';
              document.getElementById('input-endereco').value = data.logradouro || '';
              document.getElementById('input-numero').focus();
            }
          }
        } catch (err) {}
        loading.classList.add('hidden');
      }
      if (v.length > 5) v = v.replace(/^(\d{5})(\d{1,3})$/, '$1-$2');
      e.target.value = v;
    });

    // Populate existing address if saved
    window.addEventListener('DOMContentLoaded', () => {
      try {
        const stored = localStorage.getItem('tiktokshop:order');
        if (stored) {
          const o = JSON.parse(stored);
          if (o.address) {
            const a = o.address;
            if (a.nome) document.getElementById('input-nome').value = a.nome;
            if (a.telefone) document.getElementById('input-telefone').value = a.telefone;
            if (a.cpf) document.getElementById('input-cpf').value = a.cpf;
            if (a.email) document.getElementById('input-email').value = a.email;
            if (a.cep) document.getElementById('input-cep').value = a.cep;
            if (a.estado) document.getElementById('input-estado').value = a.estado;
            if (a.cidade) document.getElementById('input-cidade').value = a.cidade;
            if (a.bairro) document.getElementById('input-bairro').value = a.bairro;
            if (a.endereco) document.getElementById('input-endereco').value = a.endereco;
            if (a.numero) document.getElementById('input-numero').value = a.numero;
            if (a.complemento) document.getElementById('input-complemento').value = a.complemento;
          }
        }
      } catch(e) {}
    });

    function salvarEndereco() {
      const nome = document.getElementById('input-nome').value.trim();
      const telefone = document.getElementById('input-telefone').value.trim();
      const cpf = document.getElementById('input-cpf').value.trim();
      const email = document.getElementById('input-email').value.trim();
      const cep = document.getElementById('input-cep').value.trim();
      const estado = document.getElementById('input-estado').value.trim();
      const cidade = document.getElementById('input-cidade').value.trim();
      const bairro = document.getElementById('input-bairro').value.trim();
      const endereco = document.getElementById('input-endereco').value.trim();
      const numero = document.getElementById('input-numero').value.trim();
      const complemento = document.getElementById('input-complemento').value.trim();

      if (!nome || !telefone || !cpf || !email || !cep || !cidade || !endereco || !numero) {
        showToast('Preencha todos os campos obrigatórios');
        return;
      }

      try {
        let order = {};
        const stored = localStorage.getItem('tiktokshop:order');
        if (stored) order = JSON.parse(stored);
        order.address = {
          nome, telefone, cpf, email, cep, estado, cidade, bairro, endereco, numero, complemento
        };
        localStorage.setItem('tiktokshop:order', JSON.stringify(order));
      } catch (e) {}

      showToast('Endereço salvo com sucesso!');
      setTimeout(() => {
        window.location.href = 'checkout.html';
      }, 500);
    }
  </script>
</body>
</html>
